<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Gallery: demo page for Resolve</title>
<meta property="og:image" content="images/hero.jpg">
<style>
  :root { --ink:#1e242c; --mut:#667085; --line:#e3e6eb; --bg:#f6f7f9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header, footer { background:#fff; border-bottom:1px solid var(--line); }
  footer { border-top:1px solid var(--line); border-bottom:0; margin-top:32px; }
  .bar { max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:20px; }
  nav { margin-left:auto; display:flex; gap:18px; color:var(--mut); }
  .hero { max-width:1100px; margin:24px auto 0; padding:0 20px; }
  .hero img { width:100%; height:300px; object-fit:cover; border-radius:14px; display:block; }
  h1 { font-size:28px; margin:22px 20px 4px; max-width:1060px; margin-inline:auto; padding:0 20px; }
  .sub { color:var(--mut); max-width:1100px; margin:0 auto 18px; padding:0 20px; }
  .grid { max-width:1100px; margin:0 auto; padding:0 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { margin:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card img { width:100%; height:200px; object-fit:cover; display:block; }
  .card figcaption { padding:10px 12px; font-size:14px; color:var(--mut); }
  #more { text-align:center; color:var(--mut); padding:28px 0 0; }
  .icons { display:flex; gap:10px; margin-left:auto; }
  .note { font-size:13px; color:var(--mut); }
</style>
</head>
<body>
<header><div class="bar"><img src="images/logo.png" alt="Sample Gallery logo" width="180" height="48"><nav><span>Collections</span><span>About</span><span>Contact</span></nav></div></header>
<div class="hero"><img src="images/hero.jpg" alt="Panorama"></div>
<h1>Landscapes</h1>
<p class="sub">Scroll to load more. Thumbnails here are small; the originals are much larger.</p>
<main class="grid" id="grid"><figure class="card"><img src="images/img-01-360x240.jpg" alt="Alpine morning" loading="lazy"><figcaption>Alpine morning</figcaption></figure><figure class="card"><a href="images/img-02.jpg"><img src="images/img-02-360x240.jpg" alt="Quiet coast" loading="lazy"></a><figcaption>Quiet coast</figcaption></figure><figure class="card"><img src="images/img-03-360x240.jpg" data-full="images/img-03.jpg" alt="Desert light" loading="lazy"><figcaption>Desert light</figcaption></figure><figure class="card"><img src="images/img-04-360x240.jpg" alt="Pine ridge" loading="lazy"><figcaption>Pine ridge</figcaption></figure><figure class="card"><a href="images/img-05.jpg"><img src="images/img-05-240x360.jpg" alt="Night harbour" loading="lazy"></a><figcaption>Night harbour</figcaption></figure><figure class="card"><img src="images/img-06-360x240.jpg" data-full="images/img-06.jpg" alt="Golden valley" loading="lazy"><figcaption>Golden valley</figcaption></figure><figure class="card"><img src="images/img-07-360x240.jpg" alt="Low tide" loading="lazy"><figcaption>Low tide</figcaption></figure><figure class="card"><a href="images/img-08.jpg"><img src="images/img-08-360x240.jpg" alt="First snow" loading="lazy"></a><figcaption>First snow</figcaption></figure><figure class="card"><img src="images/img-09-360x240.jpg" data-full="images/img-09.jpg" alt="Canyon hour" loading="lazy"><figcaption>Canyon hour</figcaption></figure></main>
<div id="more">Loading more&hellip;</div>
<footer><div class="bar"><span class="note">Demo page for testing the Resolve extension. All images are generated artwork.</span>
<span class="icons"><img src="images/icon-mail.png" alt="" width="24" height="24"><img src="images/icon-share.png" alt="" width="24" height="24"><img src="images/icon-rss.png" alt="" width="24" height="24"></span></div></footer>
<script>
  const MORE = ["<figure class=\"card\"><img src=\"images/img-10-240x360.jpg\" alt=\"Still water\" loading=\"lazy\"><figcaption>Still water</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-11.jpg\"><img src=\"images/img-11-360x240.jpg\" alt=\"Dune ridge\" loading=\"lazy\"></a><figcaption>Dune ridge</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-12-360x240.jpg\" data-full=\"images/img-12.jpg\" alt=\"Fog line\" loading=\"lazy\"><figcaption>Fog line</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-13-360x240.jpg\" alt=\"Blue hour\" loading=\"lazy\"><figcaption>Blue hour</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-14.jpg\"><img src=\"images/img-14-360x240.jpg\" alt=\"Hill country\" loading=\"lazy\"></a><figcaption>Hill country</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-15-240x360.jpg\" data-full=\"images/img-15.jpg\" alt=\"Salt flats\" loading=\"lazy\"><figcaption>Salt flats</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-16-360x240.jpg\" alt=\"Autumn pass\" loading=\"lazy\"><figcaption>Autumn pass</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-17.jpg\"><img src=\"images/img-17-360x240.jpg\" alt=\"Far shore\" loading=\"lazy\"></a><figcaption>Far shore</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-18-360x240.jpg\" data-full=\"images/img-18.jpg\" alt=\"Summit haze\" loading=\"lazy\"><figcaption>Summit haze</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-19-360x240.jpg\" alt=\"Red mesa\" loading=\"lazy\"><figcaption>Red mesa</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-20.jpg\"><img src=\"images/img-20-240x360.jpg\" alt=\"Lake dusk\" loading=\"lazy\"></a><figcaption>Lake dusk</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-21-360x240.jpg\" data-full=\"images/img-21.jpg\" alt=\"Open plain\" loading=\"lazy\"><figcaption>Open plain</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-22-360x240.jpg\" alt=\"Cloud break\" loading=\"lazy\"><figcaption>Cloud break</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-23.jpg\"><img src=\"images/img-23-360x240.jpg\" alt=\"Stone beach\" loading=\"lazy\"></a><figcaption>Stone beach</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-24-360x240.jpg\" data-full=\"images/img-24.jpg\" alt=\"Winter field\" loading=\"lazy\"><figcaption>Winter field</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-25-240x360.jpg\" alt=\"Moss valley\" loading=\"lazy\"><figcaption>Moss valley</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-26.jpg\"><img src=\"images/img-26-360x240.jpg\" alt=\"Sun rise\" loading=\"lazy\"></a><figcaption>Sun rise</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-27-360x240.jpg\" data-full=\"images/img-27.jpg\" alt=\"Rain edge\" loading=\"lazy\"><figcaption>Rain edge</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-28-360x240.jpg\" alt=\"Glass bay\" loading=\"lazy\"><figcaption>Glass bay</figcaption></figure>", "<figure class=\"card\"><a href=\"images/img-29.jpg\"><img src=\"images/img-29-360x240.jpg\" alt=\"High pasture\" loading=\"lazy\"></a><figcaption>High pasture</figcaption></figure>", "<figure class=\"card\"><img src=\"images/img-30-240x360.jpg\" data-full=\"images/img-30.jpg\" alt=\"Last light\" loading=\"lazy\"><figcaption>Last light</figcaption></figure>"];
  const grid = document.getElementById('grid'), tail = document.getElementById('more');
  let next = 0, busy = false;
  // Plain scroll check (works on any static host): load while the "Loading more" line is near the bottom of the window.
  function nearBottom() { return tail.getBoundingClientRect().top < window.innerHeight + 150; }
  function check() { if (next < MORE.length && nearBottom()) load(); }
  function load() {
    if (busy || next >= MORE.length) return;
    busy = true;
    setTimeout(() => {
      grid.insertAdjacentHTML('beforeend', MORE.slice(next, next + 3).join(''));
      next += 3; busy = false;
      if (next >= MORE.length) tail.textContent = 'That is everything.'; else check();
    }, 450);
  }
  addEventListener('scroll', check, { passive: true });
  addEventListener('resize', check);
  check();
</script>
</body>
</html>
